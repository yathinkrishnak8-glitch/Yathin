<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>YATHIN 燿 — 常世 the wandering ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;800&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<!-- Motion & Animation Libraries -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

<style>
/* ============================================================
   TOKENS & CORE DESIGN SYSTEM
============================================================ */
:root {
  --ink: #0a0908;
  --ink-2: #120e0c;
  --wood: #2a1c12;
  --wood-light: #4a301c;
  --wood-grain: #1c130c;
  --lacquer: #6e1c1c;
  --lacquer-deep: #3d0f0f;
  --lacquer-bright: #a3311f;
  --gold: #c9a24c;
  --gold-bright: #eccf82;
  --gold-dim: #8a6f36;
  --jade: #3f6659;
  --jade-bright: #6fa08d;
  --parchment: #ece2c6;
  --parchment-dim: #c9bd9c;
  --azure-glow: rgba(56, 189, 248, 0.35);
  --discord-blurple: #5865f2;
  --discord-glow: rgba(88, 101, 242, 0.4);
  --glass-fill: rgba(236,226,198,0.05);
  --glass-fill-strong: rgba(236,226,198,0.09);
  --glass-border: rgba(236,226,198,0.14);
  --shadow-deep: 0 30px 80px rgba(0,0,0,0.6);
  --display: "Shippori Mincho", serif;
  --body: "Cormorant Garamond", serif;
  --mono: "IBM Plex Mono", monospace;
  --ease: cubic-bezier(.22,.68,0,1);
}

*, *::before, *::after {
  margin: 0; padding: 0; box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
  background-color: var(--ink);
  -webkit-text-size-adjust: 100%;
}

::selection {
  background: var(--gold-dim);
  color: var(--ink);
}

body {
  background: var(--ink);
  color: var(--parchment);
  font-family: var(--body);
  overflow-x: hidden;
  cursor: default;
  position: relative;
  min-height: 100vh;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

a { color: inherit; text-decoration: none; }
img, svg { display: block; max-width: 100%; }
button { font-family: inherit; cursor: pointer; border: none; background: none; }

/* Ambient wood-grain + atmospheric lighting */
body::before {
  content: "";
  position: fixed; inset: 0; z-index: -2;
  background:
    radial-gradient(ellipse 120% 80% at 50% -10%, rgba(163,49,31,0.14), transparent 60%),
    repeating-linear-gradient(100deg, rgba(0,0,0,0.35) 0px, rgba(0,0,0,0.35) 1px, transparent 2px, transparent 7px),
    linear-gradient(160deg, var(--wood-grain) 0%, var(--ink) 55%, #0a0705 100%);
  background-color: var(--ink);
}

body::after {
  content: "";
  position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(ellipse 60% 40% at 15% 10%, rgba(201,162,76,0.06), transparent 60%),
    radial-gradient(ellipse 50% 40% at 90% 85%, rgba(63,102,89,0.07), transparent 60%);
  mix-blend-mode: screen;
}

#particleCanvas {
  position: fixed; inset: 0; width: 100%; height: 100%;
  z-index: 0; pointer-events: none; opacity: 0.75;
}

/* ============================================================
   PRELOADER
============================================================ */
#preloader {
  position: fixed; inset: 0; z-index: 9999;
  background: var(--ink);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  transition: opacity 1.1s var(--ease), visibility 1.1s var(--ease);
}
#preloader.done {
  opacity: 0; visibility: hidden; pointer-events: none;
}
.seal {
  width: 124px; height: 124px; border-radius: 50%;
  border: 2px solid var(--gold-dim);
  display: flex; align-items: center; justify-content: center;
  position: relative;
  box-shadow: 0 0 35px rgba(201,162,76,0.22);
  animation: sealPulse 2.4s var(--ease) infinite;
}
.seal::before {
  content: "";
  position: absolute; inset: -14px;
  border-radius: 50%;
  border: 1px dashed rgba(201,162,76,0.35);
  animation: spin 30s linear infinite;
}
.seal span {
  font-family: var(--display);
  font-size: 2.6rem; font-weight: 800;
  color: var(--gold-bright);
  transform: scaleX(-1);
  text-shadow: 0 0 16px rgba(236,207,130,0.5);
}
@keyframes sealPulse {
  0%,100% { box-shadow: 0 0 0 0 rgba(201,162,76,0.0); transform: scale(1); }
  50% { box-shadow: 0 0 45px 10px rgba(201,162,76,0.22); transform: scale(1.03); }
}
.preload-caption {
  margin-top: 30px;
  font-family: var(--mono); letter-spacing: 0.38em; font-size: 0.65rem;
  color: var(--parchment-dim); text-transform: uppercase;
}

/* ============================================================
   NAVIGATION RAIL
============================================================ */
.railnav {
  position: fixed; right: 26px; top: 50%; transform: translateY(-50%);
  z-index: 500; display: flex; flex-direction: column; gap: 16px;
  align-items: flex-end;
}
.railnav a {
  display: flex; align-items: center; gap: 10px;
}
.railnav .dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--gold-dim);
  transition: all .4s var(--ease);
}
.railnav a:hover .dot, .railnav a.active .dot {
  background: var(--gold-bright);
  box-shadow: 0 0 12px 3px rgba(236,207,130,0.6);
  transform: scale(1.45);
}
.railnav .rlabel {
  font-family: var(--mono); font-size: 0.58rem; letter-spacing: 0.2em;
  color: var(--parchment-dim); opacity: 0; transform: translateX(8px);
  transition: all .35s var(--ease); text-transform: uppercase; white-space: nowrap;
}
.railnav a:hover .rlabel, .railnav a.active .rlabel {
  opacity: 1; transform: translateX(0); color: var(--gold-bright);
}
@media (max-width: 820px) { .railnav { display: none; } }

/* ============================================================
   AMBIENT MUSIC TOGGLE (RESPONSIVE SAFE-POSITION)
============================================================ */
#soundToggle {
  position: fixed; left: 24px; bottom: 24px; z-index: 500;
  width: 54px; height: 54px; border-radius: 50%;
  background: var(--glass-fill);
  border: 1px solid var(--glass-border);
  backdrop-filter: blur(14px) saturate(140%);
  -webkit-backdrop-filter: blur(14px) saturate(140%);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--gold-bright);
  transition: all .4s var(--ease);
  box-shadow: 0 12px 32px rgba(0,0,0,0.45);
}
#soundToggle:hover {
  transform: translateY(-2px) scale(1.05);
  border-color: var(--gold-dim);
  box-shadow: 0 14px 40px rgba(201,162,76,0.25);
}
#soundToggle svg { width: 22px; height: 22px; transition: transform .3s var(--ease); }
#soundToggle .ring, #soundToggle .ring2 {
  position: absolute; inset: -5px; border-radius: 50%;
  border: 1px solid rgba(201,162,76,0.35);
  opacity: 0; transform: scale(0.8); pointer-events: none;
}
#soundToggle.playing .ring {
  animation: soundRing 2.4s var(--ease) infinite;
}
#soundToggle.playing .ring2 {
  animation: soundRing 2.4s var(--ease) 1.2s infinite;
}
@keyframes soundRing {
  0% { opacity: 0.65; transform: scale(0.85); }
  100% { opacity: 0; transform: scale(1.6); }
}
#soundLabel {
  position: fixed; left: 88px; bottom: 40px; z-index: 500;
  font-family: var(--mono); font-size: 0.62rem; letter-spacing: 0.16em;
  color: var(--parchment-dim); text-transform: uppercase;
  opacity: 0; transition: opacity .4s, transform .4s;
  pointer-events: none; transform: translateX(-6px);
}
#soundToggle:hover ~ #soundLabel, #soundToggle.playing ~ #soundLabel {
  opacity: 1; transform: translateX(0);
}

/* Move to top-right on mobile so it never collides with bottom buttons */
@media (max-width: 768px) {
  #soundToggle {
    left: auto; right: 18px; top: 18px; bottom: auto;
    width: 44px; height: 44px;
    background: rgba(18, 14, 12, 0.85);
  }
  #soundToggle svg { width: 18px; height: 18px; }
  #soundLabel {
    left: auto; right: 70px; top: 30px; bottom: auto;
    font-size: 0.55rem;
  }
}

/* ============================================================
   SHARED MATERIAL & LAYOUT
============================================================ */
section {
  position: relative; z-index: 1;
  padding: clamp(60px, 12vw, 130px) clamp(16px, 6vw, 84px);
}

.eyebrow {
  font-family: var(--mono); font-size: 0.68rem; letter-spacing: 0.32em;
  text-transform: uppercase; color: var(--gold-dim);
  display: flex; align-items: center; gap: 14px; margin-bottom: 20px;
}
.eyebrow::before {
  content: ""; width: 32px; height: 1px; background: var(--gold-dim); flex-shrink: 0;
}
.hd {
  font-family: var(--display); font-weight: 600;
  font-size: clamp(2rem, 4.5vw, 3.8rem);
  line-height: 1.15; color: var(--parchment);
  letter-spacing: 0.01em;
}
.hd em { font-style: normal; color: var(--gold-bright); }

.panel-seam {
  height: 50px; position: relative; z-index: 2;
  background:
    linear-gradient(180deg, transparent, rgba(0,0,0,0.5)),
    repeating-linear-gradient(90deg, rgba(0,0,0,0.25) 0 2px, transparent 2px 90px);
}

.glass {
  background: linear-gradient(155deg, var(--glass-fill-strong), var(--glass-fill));
  border: 1px solid var(--glass-border);
  border-radius: 20px;
  backdrop-filter: blur(20px) saturate(150%);
  -webkit-backdrop-filter: blur(20px) saturate(150%);
  box-shadow: var(--shadow-deep), inset 0 1px 0 rgba(255,255,255,0.08);
  position: relative;
  overflow: hidden;
  transition: transform 0.45s var(--ease), border-color 0.4s, box-shadow 0.45s;
  transform-style: preserve-3d;
}

.glass::before {
  content: "";
  position: absolute; top: -60%; left: -20%; width: 70%; height: 220%;
  background: linear-gradient(100deg, rgba(255,255,255,0.12), transparent 55%);
  transform: rotate(14deg);
  pointer-events: none;
  transition: transform 1.2s var(--ease);
}
.glass:hover::before {
  transform: rotate(14deg) translateX(15%);
}

/* ============================================================
   HERO
============================================================ */
#hero {
  min-height: 100svh; display: flex; flex-direction: column;
  align-items: center; justify-content: center; text-align: center;
  padding-top: 0; overflow: hidden; position: relative;
}
.hero-frame {
  position: absolute; inset: clamp(10px, 3vw, 20px);
  border: 1px solid rgba(201,162,76,0.28);
  pointer-events: none;
}
.hero-frame::before, .hero-frame::after,
.hero-frame i::before, .hero-frame i::after {
  content: ""; position: absolute; width: clamp(18px, 4vw, 28px); height: clamp(18px, 4vw, 28px);
  border: 2px solid var(--gold);
}
.hero-frame::before { top: -2px; left: -2px; border-right: none; border-bottom: none; }
.hero-frame::after { top: -2px; right: -2px; border-left: none; border-bottom: none; }
.hero-frame i::before { bottom: -2px; left: -2px; border-right: none; border-top: none; }
.hero-frame i::after { bottom: -2px; right: -2px; border-left: none; border-top: none; }

#dragonCanvas {
  position: absolute; inset: 0; width: 100%; height: 100%;
  z-index: 0; opacity: 0.95;
}
.hero-inner { position: relative; z-index: 3; padding: 0 16px; width: 100%; max-width: 900px; }
.hero-kicker {
  font-family: var(--mono); font-size: clamp(0.62rem, 1.8vw, 0.72rem); letter-spacing: 0.4em;
  color: var(--jade-bright); text-transform: uppercase; margin-bottom: 20px;
}
.hero-title {
  font-family: var(--display); font-weight: 800;
  font-size: clamp(3.2rem, 13vw, 9.5rem);
  letter-spacing: 0.05em;
  background: linear-gradient(180deg, var(--gold-bright) 0%, var(--gold) 48%, var(--lacquer-bright) 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 8px 30px rgba(0,0,0,0.65));
  line-height: 0.95;
}
.hero-glyph {
  font-family: var(--display); font-size: clamp(1.2rem, 3vw, 2rem);
  color: var(--parchment-dim); letter-spacing: 0.45em; margin-top: 14px;
}
.hero-sub {
  max-width: 580px; margin: 28px auto 0; font-size: clamp(1.05rem, 2.4vw, 1.2rem);
  font-style: italic; color: var(--parchment-dim); line-height: 1.75;
}
.hero-sub b { color: var(--gold-bright); font-weight: 600; font-style: normal; }

.scroll-cue {
  position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  z-index: 3;
}
.scroll-cue span {
  font-family: var(--mono); font-size: 0.6rem; letter-spacing: 0.3em;
  color: var(--parchment-dim); text-transform: uppercase;
}
.scroll-line {
  width: 1px; height: 38px; background: linear-gradient(var(--gold-bright), transparent);
  position: relative; overflow: hidden;
}
.scroll-line::after {
  content: ""; position: absolute; top: -38px; left: 0; width: 100%; height: 38px;
  background: linear-gradient(var(--gold-bright), transparent);
  animation: scrollDrip 2.2s linear infinite;
}
@keyframes scrollDrip { to { top: 38px; }}

/* ============================================================
   IDENTITY / THE SEAL
============================================================ */
#identity {
  display: grid; grid-template-columns: 0.9fr 1.1fr; gap: clamp(32px, 5vw, 64px); align-items: center;
}
@media (max-width: 900px) { #identity { grid-template-columns: 1fr; }}

.id-card { padding: clamp(28px, 5vw, 44px); text-align: center; }
.id-portrait {
  width: clamp(120px, 20vw, 150px); height: clamp(120px, 20vw, 150px);
  margin: 0 auto 22px; border-radius: 50%;
  background:
    radial-gradient(circle at 35% 30%, rgba(236,207,130,0.38), transparent 60%),
    conic-gradient(from 210deg, var(--lacquer), var(--wood-light), var(--jade), var(--lacquer));
  display: flex; align-items: center; justify-content: center;
  border: 2px solid var(--gold-dim);
  position: relative;
}
.id-portrait span {
  font-family: var(--display); font-weight: 800; font-size: clamp(2.2rem, 5vw, 2.7rem); color: var(--parchment);
  text-shadow: 0 3px 12px rgba(0,0,0,0.6);
}
.id-portrait::after {
  content: ""; position: absolute; inset: -8px; border-radius: 50%;
  border: 1px dashed rgba(201,162,76,0.45);
  animation: spin 40s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); }}

.id-name { font-family: var(--display); font-weight: 800; font-size: 1.95rem; color: var(--gold-bright); }
.id-role {
  font-family: var(--mono); font-size: 0.68rem; letter-spacing: 0.2em;
  color: var(--jade-bright); text-transform: uppercase; margin-top: 6px;
}
.id-quote {
  margin-top: 22px; font-style: italic; color: var(--parchment-dim); font-size: 1.05rem; line-height: 1.7;
  border-top: 1px solid var(--glass-border); padding-top: 20px;
}

.id-text p { font-size: clamp(1.1rem, 2.2vw, 1.25rem); line-height: 1.8; color: var(--parchment-dim); margin-bottom: 18px; }
.id-text b { color: var(--gold-bright); font-weight: 600; }
.id-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 24px; }
.tag {
  font-family: var(--mono); font-size: 0.65rem; letter-spacing: 0.08em;
  padding: 8px 16px; border-radius: 999px; text-transform: uppercase;
  border: 1px solid var(--glass-border); color: var(--parchment-dim);
  background: var(--glass-fill);
  transition: all .35s var(--ease);
}
.tag:hover {
  border-color: var(--gold-dim); color: var(--gold-bright);
  transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,0.3);
}

/* ============================================================
   WORLDS I WANDER — INTEREST ARCHIVE
============================================================ */
#worlds .hd { margin-bottom: 12px; }
.worlds-intro {
  max-width: 640px; color: var(--parchment-dim); font-size: 1.1rem; line-height: 1.75; margin-bottom: clamp(36px, 6vw, 60px);
}
.archive-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(270px,1fr)); gap: clamp(18px, 3vw, 26px);
}
.artifact {
  padding: clamp(24px, 4vw, 34px); min-height: 270px;
  display: flex; flex-direction: column;
}
.artifact:hover {
  transform: translateY(-6px);
  border-color: rgba(201,162,76,0.38);
  box-shadow: 0 20px 45px rgba(0,0,0,0.5), 0 0 24px rgba(201,162,76,0.15);
}
.artifact .glyph {
  font-family: var(--display); font-size: 2.6rem; color: var(--gold-dim);
  line-height: 1; margin-bottom: 16px; transition: color .4s, transform .4s;
}
.artifact:hover .glyph {
  color: var(--gold-bright);
  transform: scale(1.08);
}
.artifact h3 {
  font-family: var(--display); font-weight: 600; font-size: 1.5rem; color: var(--parchment); margin-bottom: 5px;
}
.artifact .sub {
  font-family: var(--mono); font-size: 0.62rem; letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--jade-bright); margin-bottom: 14px;
}
.artifact p { color: var(--parchment-dim); font-size: 1.02rem; line-height: 1.68; flex: 1; }
.artifact .stamp {
  align-self: flex-end; margin-top: 18px;
  font-family: var(--display); font-size: 0.72rem; letter-spacing: 0.2em;
  color: var(--lacquer-bright); border: 1px solid rgba(163,49,31,0.55);
  padding: 4px 10px; border-radius: 4px; transform: rotate(-3deg);
}

/* ============================================================
   STATUS WINDOW (Isekai Character Sheet)
============================================================ */
#status {
  background: radial-gradient(ellipse 70% 60% at 80% 0%, rgba(110,28,28,0.2), transparent 60%);
}
.status-window {
  max-width: 940px; margin: 0 auto; padding: 0; overflow: hidden;
}
.sw-top {
  display: flex; justify-content: space-between; align-items: center;
  padding: clamp(16px, 3vw, 22px) clamp(18px, 4vw, 32px);
  border-bottom: 1px solid var(--glass-border);
  background: rgba(0,0,0,0.25);
}
.sw-top .t1 {
  font-family: var(--mono); font-size: 0.7rem; letter-spacing: 0.22em;
  color: var(--gold-bright); text-transform: uppercase;
}
.sw-top .t2 { font-family: var(--mono); font-size: 0.62rem; color: var(--parchment-dim); }
.sw-dots { display: flex; gap: 6px; }
.sw-dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--gold-dim); display: block; }

.sw-body {
  padding: clamp(24px, 5vw, 42px); display: grid; grid-template-columns: 1.1fr 0.9fr; gap: clamp(24px, 4vw, 46px);
}
@media (max-width: 760px) {
  .sw-body { grid-template-columns: 1fr; }
}

.stat-row { margin-bottom: 24px; }
.stat-row:last-child { margin-bottom: 0; }
.stat-label {
  display: flex; justify-content: space-between; align-items: baseline;
  font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--parchment-dim); margin-bottom: 9px;
}
.stat-label b {
  color: var(--gold-bright); font-family: var(--display); font-size: 0.98rem;
  letter-spacing: 0.02em; text-transform: none;
}
.stat-bar {
  height: 8px; border-radius: 99px; background: rgba(255,255,255,0.06);
  overflow: hidden; position: relative; border: 1px solid var(--glass-border);
}
.stat-fill {
  height: 100%; border-radius: 99px; width: 0%;
  background: linear-gradient(90deg, var(--lacquer), var(--gold));
  transition: width 1.4s var(--ease);
  box-shadow: 0 0 12px rgba(201,162,76,0.45);
}
.stat-fill.jade {
  background: linear-gradient(90deg, var(--jade), var(--jade-bright));
  box-shadow: 0 0 12px rgba(111,160,141,0.45);
}
.stat-note {
  font-size: 0.92rem; color: var(--parchment-dim); margin-top: 8px;
  line-height: 1.55; font-style: italic;
}

.traits-col h4 {
  font-family: var(--display); font-size: 1.3rem; color: var(--gold-bright);
  margin-bottom: 16px; font-weight: 600;
}
.trait-list { list-style: none; }
.trait-list li {
  display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px dashed var(--glass-border);
  font-size: 0.98rem; color: var(--parchment-dim); line-height: 1.55;
}
.trait-list li:last-child { border-bottom: none; }
.trait-list li .mk { color: var(--lacquer-bright); font-family: var(--display); font-weight: 800; }

.reroll-btn {
  display: inline-flex; align-items: center; gap: 8px
